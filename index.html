<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DELAMARRE STORE</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f7;color:#111}
header{background:#111;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;letter-spacing:1px}.cart{background:white;color:#111;padding:9px 14px;border-radius:999px}
main{max-width:1200px;margin:auto;padding:35px 20px}.hero{padding:30px 0 45px}.hero h1{font-size:42px;margin:0 0 10px}.muted{color:#666}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.card{background:white;border-radius:22px;padding:18px;box-shadow:0 5px 25px #0000000c}.card img{width:100%;height:260px;object-fit:contain}.price{font-size:22px;font-weight:800}.btn{border:0;border-radius:12px;padding:12px 16px;background:#111;color:white;cursor:pointer;width:100%;margin-top:12px}.btn.secondary{background:#e8e8ed;color:#111}.checkout{margin-top:35px;background:white;border-radius:22px;padding:25px}.checkout input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:12px;border-radius:10px;background:#fff3cd;margin:10px 0}.hidden{display:none}
a{color:inherit}
</style>
</head>
<body>
<header><div class="logo">DELAMARRE STORE</div><div class="cart">🛒 Panier <b id="count">0</b></div></header>
<main>
<section class="hero"><h1>iPhone, simplement.</h1><p class="muted">Produits disponibles, commande en ligne et paiement sécurisé.</p></section>
<section id="products" class="grid"></section>
<section class="checkout">
<h2>Commander</h2><div id="cart"></div>
<div class="row"><input id="name" placeholder="Nom et prénom"><input id="email" type="email" placeholder="E-mail"></div>
<input id="address" placeholder="Adresse"><div class="row"><input id="zip" placeholder="Code postal"><input id="city" placeholder="Ville"></div>
<p><b>Total : <span id="total">0,00 €</span></b></p>
<div id="paypal-note" class="notice">Le paiement PayPal sera activé après connexion de ton compte PayPal Business.</div>
<button class="btn" onclick="placeOrder()">Créer ma commande</button>
</section>
</main>
<script src="config.js"></script>
<script>
const fallback=[
{id:"ip16-256-blue",name:"iPhone 16 256 Go — Ultramarine",price:649,image:"https://store.storeimages.cdn-apple.com/4668/as-images.apple.com/is/iphone-16-finish-select-202409-6-1inch-ultramarine?wid=470&hei=556&fmt=png-alpha&.v=1724861043696"},
{id:"ip16-128-black",name:"iPhone 16 128 Go — Noir",price:579,image:"https://store.storeimages.cdn-apple.com/4668/as-images.apple.com/is/iphone-16-finish-select-202409-6-1inch-black?wid=470&hei=556&fmt=png-alpha&.v=1724861043696"},
{id:"ip16-256-pink",name:"iPhone 16 256 Go — Rose",price:639,image:"https://store.storeimages.cdn-apple.com/4668/as-images.apple.com/is/iphone-16-finish-select-202409-6-1inch-pink?wid=470&hei=556&fmt=png-alpha&.v=1724861043696"}
];
let products=fallback,cart=JSON.parse(localStorage.getItem("cart")||"[]");
function eur(n){return n.toLocaleString("fr-FR",{style:"currency",currency:"EUR"})}
function render(){
document.getElementById("products").innerHTML=products.map(p=>`<article class="card"><img src="${p.image}" alt=""><h3>${p.name}</h3><div class="price">${eur(p.price)}</div><button class="btn" onclick="add('${p.id}')">Ajouter au panier</button></article>`).join("");
document.getElementById("count").textContent=cart.reduce((a,x)=>a+x.qty,0);
document.getElementById("cart").innerHTML=cart.length?cart.map(x=>`<p>${x.name} × ${x.qty} — <b>${eur(x.price*x.qty)}</b></p>`).join(""):"<p class='muted'>Ton panier est vide.</p>";
document.getElementById("total").textContent=eur(cart.reduce((a,x)=>a+x.price*x.qty,0));
}
function add(id){let p=products.find(x=>x.id===id),x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({...p,qty:1});localStorage.setItem("cart",JSON.stringify(cart));render()}
function placeOrder(){
if(!cart.length)return alert("Ajoute au moins un produit.");
let ref="DS-"+Math.floor(10000000+Math.random()*90000000);
localStorage.setItem("last_order",JSON.stringify({ref,customer:{name:name.value,email:email.value,address:address.value,zip:zip.value,city:city.value},items:cart,total:cart.reduce((a,x)=>a+x.price*x.qty,0)}));
alert("Commande créée : "+ref+"\\nLe paiement PayPal sera ajouté après configuration.");
}
render();
</script>
</body></html>
